# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  # Julia package (Pkg) compat updates. Replaces CompatHelper (now in maintenance
  # mode); COCOA uses only the General registry, so Dependabot suffices.
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
